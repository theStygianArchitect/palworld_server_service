[project]
name = "palworld-web-manager"
version = "1.0.0"
description = "Palworld Dedicated Server Operations Suite & Web Management Plane"
readme = "README.md"
authors = [
    { name = "theStygianArchitect", email = "thestygianArchitect@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "psutil>=5.9.8",
]

[dependency-groups]
dev = [
    { include-group = "security" },
    { include-group = "linting" },
    { include-group = "testing" },
]
security = [
    "bandit>=1.8.2",
    "pip-audit>=2.7.3",
]
linting = [
    "mypy>=1.15.0",
    "pycodestyle>=2.12.1",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.4",
    "ruff>=0.9.4",
]
testing = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-rA -n auto --dist=loadfile"
log_cli = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes logic checks
    "W",      # pycodestyle warnings
    "I",      # isort import sorting
    "UP",     # pyupgrade modern Python 3.10+ syntax
    "B",      # flake8-bugbear bug prevention
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific lint rules
    "ASYNC",  # flake8-async best practices
    "PIE",    # flake8-pie code cleanliness
    "PGH",    # pygrep-hooks (error codes on type comments)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true

[tool.pydocstyle]
convention = "google"

[tool.pylint]
max-line-length = 120

[tool.pylint."messages control"]
disable = []

[tool.pycodestyle]
max-line-length = 120

[tool.bandit]
# Security Scanner Skips:
# B104: Web management plane intentionally binds to 0.0.0.0 or LAN IP for remote dashboard access
# B110: Benign fallback checks (e.g. non-fatal directory checks) where failure has no operational impact
# B404: Subprocess module is required to interact with systemctl, steamcmd, ping, and OS utilities
# B603: Subprocess calls use explicit argument lists without shell=True for secure execution
# B607: System binaries (systemctl, ping, ip, journalctl) are discovered dynamically via PATH / shutil.which
skips = [
    "B104", # hardcoded_bind_all_interfaces: Web interface binds to 0.0.0.0 / eth0 IP for admin dashboard access
    "B110", # try_except_pass: Benign fallback checks where failure has zero operational security impact
    "B404", # blacklist:import_subprocess: Subprocess required for systemctl, steamcmd, and network diagnostic utilities
    "B603", # subprocess_without_shell_equals_true: Subprocess invocations use validated argument lists without shell=True
    "B607", # start_process_with_partial_path: System utilities (systemctl, ping, ip) are resolved via PATH
]

[tool.bandit.assert_used]
# Assertions are standard testing idioms and are safe in pytest suites
skips = ['*_test.py', '*/test_*.py']
