[project]
name = "palworld-web-manager"
version = "1.0.0"
description = "Palworld Dedicated Server Operations Suite & Web Management Plane"
readme = "README.md"
authors = [
    { name = "theStygianArchitect", email = "thestygianArchitect@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "psutil>=5.9.8",
]

[dependency-groups]
dev = [
    { include-group = "security" },
    { include-group = "linting" },
    { include-group = "testing" },
]
security = [
    "bandit>=1.8.2",
    "pip-audit>=2.7.3",
]
linting = [
    "mypy>=1.15.0",
    "pycodestyle>=2.12.1",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.4",
    "ruff>=0.9.4",
]
testing = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-rA"
log_cli = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true

[tool.pydocstyle]
convention = "google"

[tool.pylint]
max-line-length = 120

[tool.pycodestyle]
max-line-length = 120

[tool.bandit]
skips = ["B104", "B110", "B404", "B603", "B607"]

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']
