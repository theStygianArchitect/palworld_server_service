name: Test Branch Quality & Idempotency Gate

on:
  push:
    branches: [test, "feature/**", "bugfix/**"]
  pull_request:
    branches: [test]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality-gate:
    name: Code Qualifications & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Sync Dependencies with uv
        run: uv sync --all-groups

      - name: Run Zero-Leak Secret Scanner
        run: uv run python scripts/scan_secrets.py

      - name: Run AST Exception & Logging Audit
        run: uv run python scripts/audit_exceptions.py app scripts tests

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: uv run pip-audit --local --skip-editable

      - name: Run Static Application Security Testing (Bandit)
        run: uv run bandit -c pyproject.toml -r app scripts tests

      - name: Run Ruff Linter & Formatter Check
        run: uv run ruff check .

      - name: Run Strict Mypy Type Analysis
        run: uv run mypy app scripts tests

      - name: Run Pylint Standard (10.00/10)
        run: uv run pylint --rcfile=pyproject.toml app tests

      - name: Run Google Docstring Validation (pydocstyle)
        run: uv run pydocstyle app scripts

      - name: Run Parallel Unit Tests & Code Coverage (pytest-xdist)
        run: uv run pytest --cov=app --cov-report=term-missing tests

  idempotent-install-gate:
    name: Clean Install & Idempotency Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck acl

      - name: Run Clean Install & Idempotency Verification
        run: sudo bash scripts/test_install_idempotency.sh

  auto-promote-to-dev:
    name: Auto-Promote test -> dev (Staging)
    needs: [quality-gate, idempotent-install-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-Forward / Merge test into dev
        run: |
          set -euo pipefail
          echo ">>> Fetching branches..."
          git fetch origin dev:dev || git checkout -b dev origin/dev
          git checkout dev
          DIFF_COUNT=$(git rev-list --count dev..origin/test || echo 0)
          if [ "${DIFF_COUNT}" -eq 0 ]; then
            echo "[*] dev is already up to date with test. No promotion needed."
            exit 0
          fi
          echo ">>> Merging test into dev..."
          git merge --ff-only origin/test || git merge --no-ff origin/test -m "chore(release): promote test to dev [staging gate passed]"
          git push origin dev
          echo "[+] Successfully promoted test -> dev."

  log-bug-on-failure:
    name: Log Automated Bug Report on Gate Failure
    needs: [quality-gate, idempotent-install-gate]
    if: failure() && (github.ref == 'refs/heads/test' || github.base_ref == 'test')
    runs-on: ubuntu-latest

    steps:
      - name: File Automated GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[BUG] Test Gate Failure on commit ${GITHUB_SHA::8}" \
            --label "bug" \
            --body "### 🚨 Automated Test Gate Failure
          
          The automated quality or clean installation idempotency gate failed on branch \`${GITHUB_REF_NAME}\`.
          
          - **Trigger Event:** \`${GITHUB_EVENT_NAME}\`
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Run ID:** [View GitHub Actions Run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          
          ### 🛠️ Required Action
          1. Create a patch branch: \`bugfix/patch-${GITHUB_SHA::8}\`
          2. Resolve the failing qualification checks locally with \`./quality_check.sh -a\` and \`sudo bash scripts/test_install_idempotency.sh\`
          3. Promote the fix through \`./scripts/gitflow.sh promote-to-test\`" || true
